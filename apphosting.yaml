runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: STAMP_DB_BACKEND
    value: firestore
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: stampwooshin
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: stampwooshin.firebasestorage.app
    availability:
      - RUNTIME
  - variable: APP_SECRET
    secret: APP_SECRET
    availability:
      - RUNTIME
  - variable: ADMIN_CODE_SEED
    secret: ADMIN_CODE_SEED
    availability:
      - RUNTIME
  - variable: BOOTSTRAP_SUPERADMIN_PASSWORD
    secret: BOOTSTRAP_SUPERADMIN_PASSWORD
    availability:
      - RUNTIME
