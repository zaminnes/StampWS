<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StampWS AE Phone Scenes</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: rgba(226, 232, 240, 0.76);
      --panel: rgba(8, 13, 25, 0.58);
      --line: rgba(255, 255, 255, 0.16);
      --blue: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: #050914;
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      height: 100vh;
      object-fit: cover;
      width: 100vw;
    }

    .controls {
      align-items: center;
      backdrop-filter: blur(24px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      bottom: 22px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      display: flex;
      gap: 8px;
      left: 50%;
      padding: 8px;
      position: fixed;
      transform: translateX(-50%);
      transition: opacity 220ms ease, transform 220ms ease;
      z-index: 3;
    }

    .controls.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(18px);
    }

    button,
    a {
      border: 0;
      border-radius: 999px;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      min-height: 38px;
      padding: 0 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    button.primary,
    a {
      background: #fff;
      color: #0f172a;
    }

    button.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .version-switch button[data-version="classic"].active {
      background: #d97706;
      border-color: #f59e0b;
      color: #fff;
    }

    .version-switch button[data-version="boss"].active {
      background: #7f1d1d;
      border-color: #dc2626;
      color: #fff;
    }

    .version-switch {
      display: flex;
      gap: 4px;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
      white-space: nowrap;
    }

    .tap {
      align-items: center;
      backdrop-filter: blur(28px);
      background: rgba(2, 6, 23, 0.72);
      display: grid;
      inset: 0;
      justify-items: center;
      padding: 24px;
      position: fixed;
      text-align: center;
      z-index: 2;
    }

    .tap-card {
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .tap-card strong {
      display: block;
      font-size: clamp(46px, 8vw, 108px);
      font-weight: 950;
      letter-spacing: -0.09em;
      line-height: 0.86;
    }

    .tap-card span {
      color: var(--muted);
      font-size: 17px;
      font-weight: 850;
    }
  </style>
</head>

      <button class="primary" type="button">재생</button>
    </div>
  </div>

    <span class="version-switch" aria-label="version switch">
      <button class="active" data-version="classic" type="button">클래식</button>
      <button data-version="boss" type="button">파이널</button>

        const rotate = (flash - 0.4) * (boss ? 0.055 : classic ? 0.025 : 0.08) + Math.sin(seconds * 4.2 + index) * (boss ? 0.01 : classic ? 0.006 : 0.012);
        const lift = -flash * size * (boss ? 0.1 : classic ? 0.04 : 0.08) + Math.sin(seconds * 6 + index) * (boss ? 2.5 : classic ? 1 : 2);
        const accent = boss ? (index % 4 === 0 ? "#fecaca" : "#fff1f2") : classic ? (index % 4 === 0 ? "#fef3c7" : "#fff7ed") : (index % 4 === 0 ? "#dbeafe" : "#f8fafc");
        const flashColor = boss
          ? (index % 3 === 0 ? "#ef4444" : index % 3 === 1 ? "#facc15" : "#ffffff")
          : classic
          ? (index % 3 === 0 ? "#facc15" : index % 3 === 1 ? "#fde68a" : "#ffffff")
          : (index % 3 === 0 ? "#60a5fa" : index % 3 === 1 ? "#fef08a" : "#38bdf8");
        const color = flash > 0.35 ? flashColor : accent;

        ctx.save();
        ctx.translate(x + width / 2, lift);
        ctx.rotate(rotate);
        ctx.scale(scale, scale);
        ctx.font = fontSpec(size);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.shadowColor = boss ? "rgba(127,29,29,0.48)" : classic ? "rgba(250,204,21,0.2)" : "rgba(0,0,0,0.42)";
        ctx.shadowBlur = boss ? 34 : classic ? 30 : 24;
        ctx.shadowOffsetY = boss ? 15 : classic ? 7 : 12;
        ctx.strokeStyle = boss ? "rgba(3,7,18,0.94)" : classic ? "rgba(8,13,25,0.86)" : "rgba(2,6,23,0.92)";
        ctx.lineWidth = Math.max(8, size * (boss ? 0.1 : classic ? 0.075 : 0.09));
        ctx.strokeText(char, 0, 0);
        ctx.shadowColor = "transparent";
        ctx.fillStyle = color;
        ctx.fillText(char, 0, 0);
        ctx.restore();
        x += width;
      });

      return totalWidth;
    }

    function drawKineticLyric(seconds) {
      const cue = cueAt(seconds);
      if (!cue) return;
      const cp = cueProgress(cue, seconds);
      const alpha = snap(cp * 14) * snap((1 - cp) * 10);
      if (alpha <= 0.01) return;

      const scene = sceneAt(seconds);
      const cueIndex = lyricCues.indexOf(cue);
      const [centerX, centerYBase, rotate] = lyricLayout(scene, cueIndex);
      const classic = currentVersionKey === "classic";
      const boss = currentVersionKey === "boss";
      const maxWidth = scene.kind === "rewards" ? 520 : scene.kind === "opening" ? 1180 : 820;
      const base = scene.kind === "opening" ? cue.size * (boss ? 1.02 : classic ? 0.9 : 0.98) : Math.min(cue.size * (boss ? 0.96 : classic ? 0.84 : 0.9), boss ? 124 : classic ? 106 : 116);
      const size = fitSize(cue.text, base, maxWidth);
      const enter = snap(cp * 8);
      const exit = snap((1 - cp) * 8);
      const slideSide = cueIndex % 2 === 0 ? -1 : 1;
      const punch = 1 + (boss ? 0.08 : classic ? 0.025 : 0.05) * Math.sin(cp * Math.PI * 2);
      const scale = mix(boss ? 0.78 : classic ? 0.9 : 0.84, 1, enter) * mix(1, boss ? 0.88 : classic ? 0.96 : 0.92, 1 - exit) * punch;
      const x = centerX + slideSide * mix(boss ? 96 : classic ? 38 : 70, 0, enter);
      const y = centerYBase + Math.sin(seconds * (boss ? 3.8 : classic ? 2.6 : 4.8)) * (boss ? 7 : classic ? 3 : 5) + mix(boss ? 42 : classic ? 18 : 30, 0, enter);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rotate + Math.sin(seconds * 2.1) * 0.01);
      ctx.scale(scale, scale);
      const width = drawGlyphLyric(cue.text, size, seconds, cp);
      ctx.restore();

      drawMotionLines(x, y + size * 0.48, Math.min(760, width + 130), alpha * (boss ? 0.34 : classic ? 0.08 : 0.22), seconds);
    }

    function drawBackground(t) {
      const classic = currentVersionKey === "classic";
      const boss = currentVersionKey === "boss";
      const g = ctx.createLinearGradient(0, 0, W, H);

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const blue = ctx.createRadialGradient(W * (0.18 + 0.03 * Math.sin(t * 0.3)), H * 0.22, 0, W * 0.18, H * 0.22, 650);

      cyan.addColorStop(1, boss ? "rgba(234,88,12,0)" : classic ? "rgba(255,247,237,0)" : "rgba(96,165,250,0)");

      ctx.fillRect(0, 0, W, H);

      const glass = ctx.createLinearGradient(-200 + (t * 32) % 2400, 0, 400 + (t * 32) % 2400, H);
      glass.addColorStop(0, "rgba(255,255,255,0)");
      glass.addColorStop(0.48, boss ? "rgba(248,113,113,0.12)" : classic ? "rgba(255,255,255,0.075)" : "rgba(255,255,255,0.1)");
      glass.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glass;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalAlpha = boss ? 0.035 : classic ? 0.045 : 0.08;
      ctx.strokeStyle = boss ? "#fecaca" : classic ? "#fef3c7" : "#ffffff";

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.restore();

      if (classic || boss) {
        ctx.save();
        ctx.globalAlpha = boss ? 0.18 : 0.12;
        ctx.strokeStyle = boss ? "#ef4444" : "#fef3c7";
        ctx.lineWidth = boss ? 2.2 : 1.5;
        for (let i = 0; i < (boss ? 7 : 5); i += 1) {
          ctx.beginPath();
          ctx.arc(W / 2, H / 2, (boss ? 170 : 210) + i * (boss ? 82 : 95) + Math.sin(t * (boss ? 0.7 : 0.45) + i) * (boss ? 20 : 12), 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawQR(x, y, s, label, phase = 0) {

    function drawParticles(cx, cy, p) {
      ctx.save();
      ctx.globalAlpha = ease(clamp(p * 2)) * ease(clamp((1 - p) * 2));
      for (let i = 0; i < 28; i += 1) {
        const a = (i / 28) * Math.PI * 2;
        const d = 80 + 160 * ease(p);
        ctx.fillStyle = i % 3 === 0 ? "#ffffff" : i % 3 === 1 ? "#60a5fa" : "#2563eb";
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 4 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawImageContain(img, x, y, w, h) {
      if (!img.complete || !img.naturalWidth) return false;
      const scale = Math.min(w / img.naturalWidth, h / img.naturalHeight);
      const iw = img.naturalWidth * scale;
      const ih = img.naturalHeight * scale;
      ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
      return true;
    }

    function drawComicBurst(cx, cy, radius, alpha, phase, color = "rgba(250,204,21,0.92)") {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.rotate(phase * 0.5);
      ctx.beginPath();
      for (let i = 0; i < 24; i += 1) {
        const r = i % 2 === 0 ? radius : radius * 0.62;
        const a = (i / 24) * Math.PI * 2;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.78)";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();
    }

    function drawHalftone(cx, cy, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(255,255,255,0.42)";
      for (let row = 0; row < 9; row += 1) {
        for (let col = 0; col < 13; col += 1) {
          const r = 2 + ((row + col) % 4);
          ctx.beginPath();
          ctx.arc(cx + col * 22, cy + row * 22, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function windowAlpha(seconds, start, end) {
      return snap((seconds - start) / 0.7) * snap((end - seconds) / 0.8);
    }

    function drawKeyedVideoFrame(video, w, h) {
      const outW = Math.max(1, Math.round(w));
      const outH = Math.max(1, Math.round(h));
      if (keyedVideoCanvas.width !== outW || keyedVideoCanvas.height !== outH) {
        keyedVideoCanvas.width = outW;
        keyedVideoCanvas.height = outH;
      }
      keyedVideoCtx.clearRect(0, 0, outW, outH);
      keyedVideoCtx.drawImage(video, 0, 0, outW, outH);
      let frame;
      try {
        frame = keyedVideoCtx.getImageData(0, 0, outW, outH);
      } catch {
        if (!taintWarningShown) {
          taintWarningShown = true;
          statusEl.textContent = "http://127.0.0.1:4174 로 열기";
        }
        return video;
      }
      const data = frame.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const saturation = max - min;
        if (max < 34 && saturation < 20) {
          data[i + 3] = 0;
        } else if (max < 72 && saturation < 26) {
          data[i + 3] = Math.round(data[i + 3] * clamp((max - 34) / 38));
        }
      }
      keyedVideoCtx.putImageData(frame, 0, 0);
      return keyedVideoCanvas;
    }

    function drawVideoCutout(video, cx, cy, w, h, alpha, rotation, scale, mirror = false) {
      if (!video || video.readyState < 2) return;
      const keyedFrame = video.dataset.keyed === "1" ? video : drawKeyedVideoFrame(video, w, h);
      const boss = currentVersionKey === "boss";
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.scale((mirror ? -1 : 1) * scale, scale);
      ctx.shadowColor = boss ? "rgba(239,68,68,0.52)" : "rgba(0,0,0,0.34)";
      ctx.shadowBlur = boss ? 42 : 28;
      ctx.shadowOffsetY = boss ? 24 : 18;
      if (boss) {
        ctx.fillStyle = "rgba(127,29,29,0.36)";
        ctx.beginPath();
        ctx.ellipse(0, h * 0.34, w * 0.42, h * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.drawImage(keyedFrame, -w / 2, -h / 2, w, h);
      ctx.restore();
    }

        { key: "james", start: beat(74), end: beat(112), x: 1600, y: 790, w: 330, h: 500, rot: 0.1, mirror: true },
        { key: "sw", start: beat(118), end: beat(134), x: 560, y: 820, w: 280, h: 430, rot: -0.04, mirror: true },
        { key: "james", start: beat(132), end: beat(150), x: 1360, y: 820, w: 280, h: 430, rot: 0.04, mirror: false },
        { key: "sw", start: beat(164), end: beat(204), x: 300, y: 790, w: 330, h: 500, rot: -0.08, mirror: false },
        { key: "james", start: beat(166), end: beat(204), x: 1610, y: 790, w: 330, h: 500, rot: 0.08, mirror: true },

      if (scene.kind === "coupon" || scene.kind === "couponMove") {
        const a = snap(p * 3.8);
        drawPhoneZoom(1225, 530, 400, 710, 0.7 + 0.34 * a + 0.03 * Math.sin(seconds * 2.7), 0.04 + 0.02 * Math.sin(seconds), {
          type: "coupon", title: "쿠폰", pill: "5 / 5", qr: "쿠폰", main: "보상 선택", sub: "하나만 받을 수 있음"
        }, t, a);
        drawRewardMenu(seconds, p);
      }

      if (scene.kind === "redeem") {
        const a = snap(p * 3.8);
        drawPhoneZoom(620 - 100 * (1 - a), 532, 360, 640, 0.9 + 0.15 * a + 0.025 * Math.sin(seconds * 2.2), -0.16, {
          type: "coupon", title: "쿠폰", pill: "READY", qr: "쿠폰 QR", main: "사용하기", sub: "보상 부스에서"
        }, t, a);
        drawPhoneZoom(1190 + 100 * (1 - a), 526, 360, 640, 0.9 + 0.15 * a + 0.025 * Math.cos(seconds * 2.2), 0.16, {
          type: "scanner", title: "보상", pill: "USE", main: "수령 완료", sub: "사용 기록 저장"
        }, p, a);
      }

      if (scene.kind === "rewards") {
        rewardAssets.forEach((asset, index) => {
          const local = clamp((p - index * 0.18) / 0.26);
          const a = snap(local) * snap((1 - local) * 2.9);
          const x = [270, 1010, 430, 1160][index];
          const y = [245, 245, 570, 570][index];
          drawRewardCard(asset, x, y, 430, 270, a, 0.86 + a * 0.16 + Math.sin(seconds * 5 + index) * 0.015);
          if (a > 0.05) drawComicBurst(x + 382, y + 46, 40, a * (boss ? 0.28 : classic ? 0.07 : 0.18), seconds + index, boss ? "rgba(220,38,38,0.72)" : classic ? "rgba(254,243,199,0.42)" : `${asset.color}aa`);
        });
      }

      if (scene.kind === "end") {
        const a = snap(p * 3.4);
        drawPhoneZoom(960, 535 - 30 * a, 430, 680, 0.66 + 0.44 * a, 0, {
          type: "qr", title: "StampWS", pill: "OPEN", qr: "WS", main: "stampws.kr", sub: "현장에서 바로 사용"
        }, t, a);
        ctx.save();
        ctx.globalAlpha = a;
        drawText("stampws.kr", W / 2, 955, 46, 950, "#ffffff", "center");
        ctx.restore();
      }

      drawPerformers(seconds);
      drawKineticLyric(seconds);
    }

    function loop(now) {
      const seconds = audio.paused ? ((now - startTime) / 1000) % DURATION : Math.min(audio.currentTime, DURATION);
      drawScene(seconds);
      if (!recording && playing && audio.currentTime >= DURATION - 0.05) {
        playNextVersion();
        return;
      }
      if (playing || recording) loopId = requestAnimationFrame(loop);
    }

    function setupAudioGraph() {
      if (audioDestination) return audioDestination.stream;
      audioContext = audioContext || new AudioContext();
      audioSource = audioSource || audioContext.createMediaElementSource(audio);
      audioDestination = audioContext.createMediaStreamDestination();
      audioSource.connect(audioContext.destination);
      audioSource.connect(audioDestination);
      return audioDestination.stream;
    }

    function updateVersionButtons() {
      versionButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.version === currentVersionKey);
      });
    }

    function setAudioVersion(versionKey, restart = false) {
      if (!AUDIO_VERSIONS[versionKey] || recording) return;
      const wasPlaying = restart && playing;
      currentVersionKey = versionKey;
      currentVersion = AUDIO_VERSIONS[currentVersionKey];
      updateTiming();
      scenes = buildScenes();
      lyricCues = buildLyricCues();
      updateVersionButtons();
      audio.pause();
      audio.loop = false;
      audio.src = currentVersion.src;
      audio.load();
      audio.currentTime = 0;
      startTime = performance.now();
      statusEl.textContent = `${currentVersion.label} 준비`;
      drawScene(0);
      if (wasPlaying) play();
    }

    function nextVersionKey() {
      const index = VERSION_ORDER.indexOf(currentVersionKey);
      return VERSION_ORDER[(index + 1) % VERSION_ORDER.length] || VERSION_ORDER[0];
    }

    function playNextVersion() {
      setAudioVersion(nextVersionKey(), false);
      play();
    }

    async function play() {
      playing = true;
      tap.style.display = "none";
      document.querySelector(".controls")?.classList.add("hidden");
      statusEl.textContent = `${currentVersion.label} 재생`;
      startTime = performance.now();
      try {
        if (audioContext?.state === "suspended") await audioContext.resume();
        audio.currentTime = 0;
        audio.loop = false;
        await startOverlayVideos();
        await audio.play();
      } catch {
        statusEl.textContent = "오디오 권한 필요";
      }
      cancelAnimationFrame(loopId);
      loopId = requestAnimationFrame(loop);
    }

    function supportedMime() {
      const types = [
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
        "video/mp4;codecs=avc1.640028,mp4a.40.2",
        "video/mp4;codecs=h264,aac",
        "video/mp4;codecs=h264",
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];
      return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    async function exportVideo() {
      if (recording) return;
      recording = true;
      playing = false;
      tap.style.display = "none";
      document.querySelector(".controls")?.classList.remove("hidden");
      exportButton.disabled = true;
      statusEl.textContent = "녹화 준비";
      const mimeType = supportedMime();
      const videoStream = canvas.captureStream(60);
      let audioStream = null;
      try {
        audioStream = setupAudioGraph();
        if (audioContext.state === "suspended") await audioContext.resume();
      } catch {
        audioStream = null;
      }
      const stream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...(audioStream ? audioStream.getAudioTracks() : [])
      ]);
      const recorder = new MediaRecorder(stream, {
        mimeType: mimeType || undefined,
        videoBitsPerSecond: 14_000_000
      });
      const chunks = [];

      recorder.ondataavailable = (event) => {
        if (event.data.size > 0) chunks.push(event.data);
      };
      recorder.onstop = () => {
        const type = recorder.mimeType || mimeType || "video/webm";
        const blob = new Blob(chunks, { type });
        const isMp4 = type.includes("mp4");
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `stampws-${currentVersionKey}-phone-scenes.${isMp4 ? "mp4" : "webm"}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        statusEl.textContent = isMp4 ? "MP4+오디오 저장 완료" : "MP4 미지원, WEBM+오디오 저장";
        exportButton.disabled = false;
        recording = false;
        play();
      };

      startTime = performance.now();
      audio.loop = false;
      audio.currentTime = 0;
      await startOverlayVideos();
      await audio.play();
      cancelAnimationFrame(loopId);
      loopId = requestAnimationFrame(loop);
      recorder.start(1000);

      const startedAt = performance.now();
      const timer = setInterval(() => {
        const elapsed = (performance.now() - startedAt) / 1000;
        statusEl.textContent = `녹화 ${Math.min(elapsed, DURATION).toFixed(1)}s`;
        if (elapsed >= DURATION) {
          clearInterval(timer);
          recorder.stop();
          stream.getTracks().forEach((track) => track.stop());
          audio.pause();
        }
      }, 120);
    }

    audio.addEventListener("loadedmetadata", () => {
      statusEl.textContent = `${currentVersion.label} ${audio.duration.toFixed(1)}s`;
    });
    audio.addEventListener("ended", () => {
      if (playing && !recording) {
        playNextVersion();
      }
    });

    versionButtons.forEach((button) => {
      button.addEventListener("click", () => setAudioVersion(button.dataset.version, playing));
    });
    playButton.addEventListener("click", () => play());
    exportButton.addEventListener("click", exportVideo);
    document.addEventListener("click", (event) => {
      if (event.target.closest(".controls") || event.target.closest("a")) return;
      if (!playing && !recording) play();
    });

    updateVersionButtons();
    drawScene(0);
  </script>
</body>
</html>
